<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Ekdosis-TEI Studio{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>Ekdosis-TEI Studio</h1>
    <p>Plate-forme de saisie, d'encodage et de visualisation pour l'édition critique du théâtre classique</p>
    <nav class="main-nav">
      <a href="{{ url_for('web.index') }}">Établi</a>
      <a href="/publish/builder">Constructeur de site</a>
      <a href="/about">À propos d'ETS</a>
    </nav>
    {% block subnav %}{% endblock %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <img src="{{ url_for('static', filename='logos.jpg') }}" alt="Logos institutionnels" class="footer-logos">
    <p class="powered-by">Propulsé par <a href="https://github.com/Gheeraert/Ekdosis-TEI-Studio">Ekdosis-TEI Studio</a></p>
  </footer>
</body>
</html>
